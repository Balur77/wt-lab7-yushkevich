services:
  postgres:
    image: postgres:16-alpine
    container_name: wt-lab7-postgres
    environment:
      POSTGRES_DB: wt_lab7
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wt-lab7-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wt_lab7"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: wt-lab7-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wt_lab7;Username=postgres;Password=postgres"
    ports:
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wt-lab7-pgdata:
