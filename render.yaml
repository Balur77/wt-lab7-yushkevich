databases:
  - name: wt-lab7-db-yushkevich
    databaseName: wt_lab7
    user: wt_lab7_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: wt-lab7-7postgres-efcore-yushkevich
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wt-lab7-db-yushkevich
          property: connectionString
